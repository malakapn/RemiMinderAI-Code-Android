name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Secrets: DEBUG_KEYSTORE_BASE64, KEYSTORE_ALIAS, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      # Upload keystore for Gradle release signing (matches android/app/build.gradle.kts).
      - name: Restore upload keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p apps/mobile/android/app
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/upload-keystore.jks

      - name: Print SHA-1 (confirm)
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore apps/mobile/android/app/upload-keystore.jks \
            -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -keypass "$KEYSTORE_KEY_PASSWORD" | grep SHA1

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Create apps/mobile/.env for Flutter asset bundle
        run: |
          cat > apps/mobile/.env << EOF
          GOOGLE_WEB_CLIENT_ID=575820802106-m8q0lu61mdgls5r354uvd93phvf7ig9a.apps.googleusercontent.com
          API_BASE_URL=http://localhost:8000
          MOBILE_API_BASE_URL=http://localhost:8000
          FLUTTER_ENV=development
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build release APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remiminderai-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

name: Flutter Build App Bundle
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Decoded keystore file is empty"
            exit 1
          fi
      - name: Print keystore fingerprints (confirm)
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          if [ -n "${KEYSTORE_ALIAS:-}" ] && [ -n "${KEYSTORE_STORE_PASSWORD:-}" ]; then
            KP="${KEYSTORE_KEY_PASSWORD:-$KEYSTORE_STORE_PASSWORD}"
            keytool -list -v \
              -keystore "$KS" \
              -alias "$KEYSTORE_ALIAS" \
              -storepass "$KEYSTORE_STORE_PASSWORD" \
              -keypass "$KP"
          else
            keytool -list -v \
              -keystore "$KS" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android
          fi
      - name: Copy upload keystore to android/app
        run: cp upload-keystore.jks apps/mobile/android/app/upload-keystore.jks
      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json
      - name: Create apps/mobile/.env for Flutter asset bundle
        run: |
          {
            echo "GOOGLE_WEB_CLIENT_ID=575820802106-m8q0lu61mdgls5r354uvd93phvf7ig9a.apps.googleusercontent.com"
            echo "API_BASE_URL=https://remiminder-backend-575820802106.us-central1.run.app"
            echo "MOBILE_API_BASE_URL=https://remiminder-backend-575820802106.us-central1.run.app"
            echo "FLUTTER_ENV=production"
          } > apps/mobile/.env
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Build release App Bundle
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build appbundle --release
        working-directory: apps/mobile
      # Skip on PRs — each AAB is large and fills the org artifact quota quickly.
      - name: Upload App Bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: remiminderai-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          overwrite: true
          compression-level: 6

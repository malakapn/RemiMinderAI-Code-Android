services:
  # Phase 2 Backend (FastAPI)
  backend:
    build: ./apps/backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "8001:8001"
    env_file:
      - ./apps/backend/.env
    environment:
      - ENV=development
      - DEBUG=True
    volumes:
      - ./apps/backend:/app
    depends_on:
      - postgres
    networks:
      - mediminder-network

  # STT + AI Summary worker (required for audio processing)
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend:/app
    depends_on:
      - backend
    networks:
      - mediminder-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mediminder_db
      POSTGRES_USER: mediminder
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediminder-network

  # Phase 1 Web App (React)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mediminder-network

volumes:
  postgres_data:

networks:
  mediminder-network:
    driver: bridge